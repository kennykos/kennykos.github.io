- content: "Pronto adquirió el aspecto de desamparo propio de los vegetarianos. La piel se le cubrió de un musgo tierno, semejante al que prosperaba en el chaleco anacrónico que no se quitó jamás, y su respiración exhaló un tufo de animal dormido."
  author: "Gabriel García Márquez"
  source: "Cien años de soledad"

- content: |-
    Yes, we speak of things that matter
    With words that must be said
    "Can analysis be worthwhile?"
    "Is the theater really dead?"
  author: "Paul Simon"
  source: "The Dangling Conversation"

- content: "Pensar, analizar, inventar -me escribió también- no son actos anómalos, son la normal
respiración de la inteligencia. Glorificar el ocasional cumplimiento de esa función, atesorar antiguos y ajenos pensamientos, recordar con incrédulo estupor que el doctor universalis
pensó, es confesar nuestra languidez o nuestra barbarie. Todo hombre debe ser capaz de
todas las ideas y entiendo que en el porvenir lo será."
  author: Jorge Luis Borges
  source: Pierre Menard, autor del Quijote

- content: "Because some years previously in 1886 when occupied with the problem of the quadrature of the circle he had learned of the existence of a number computed to a relative degree of accuracy to be of such magnitude and of so many places, e.g., the 9th power of the 9th power of 9, that, the result having been obtained, 33 closely printed volumes of 1000 pages each of innumerable quires and reams of India paper would have to be requisitioned in order to contain the complete tale of its printed integers of units, tens, hundreds, thousands, tens of thousands, hundreds of thousands, millions, tens of millions, hundreds of millions, billions, the nucleus of the nebula of every digit of every series containing succinctly the potentiality of being raised to the utmost kinetic elaboration of any power of any of its powers."
  author: James Joyce
  source: Ulysseys

- content: "Just write this on your wrist or something. Function x, exponent n, the derivative's going to be nx + xn-1 for any kind of first-order rate-of-increase thing they're going to ask you. This assumes a definable limit, of course ..."
  author: David Foster Wallace
  source: Infinite Jest

- content: "They rode on again in the late afternoon. By sunset they could hear trucks on a highway in the distance and in the long cool evening they rode west along a rise from which they could see the headlights on the highway going out and coming back random and periodic in their slow exchange."
  author: Cormac McCarthy
  source: All the Pretty Horses
