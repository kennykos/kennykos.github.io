github_users:
  - kennykos

github_repos:
  - name: ut-padas/parki
    contributions: >
      Project maintainer and lead contributor.
      Developed CPU/GPU Ewald summation algorithms for
      the Stokes and Laplace kernels in different periodic
      regimes.
  - name: kokkos/pykokkos
    contributions: >
      Project collaborator and top 10 contributor.
      Implemented functionality for mathematical special functions, automatic just-in-time (JIT) recompilation, CMake
      JIT compilation, building and installing on MacOS and AMD GPUs, documentation and continuous integration.
  - name: sandialabs/GenTen
    contributions: >
      Implemented a matrix-free MTTKRP for dense tensors: [``MTTKRP_Dense_Perm_Kernel``](https://github.com/sandialabs/GenTen/blob/4ca65d5678029f08e3679ca72fadd34197cc65f5/src/Genten_MixedFormatOps.cpp#L720), the basis for the publication [*A Performance Portable Matrix Free Dense MTTKRP in GenTen*](https://arxiv.org/abs/2510.14891).
